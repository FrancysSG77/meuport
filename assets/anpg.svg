<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="100%" height="100%">
  <defs>
    <linearGradient id="anpgBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0c14"/>
      <stop offset="50%" stop-color="#0e1322"/>
      <stop offset="100%" stop-color="#08090f"/>
    </linearGradient>

    <linearGradient id="anpgCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F5D4"/>
      <stop offset="100%" stop-color="#0099FF"/>
    </linearGradient>

    <linearGradient id="anpgGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFB703"/>
      <stop offset="100%" stop-color="#FB8500"/>
    </linearGradient>

    <linearGradient id="glassBar" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.08)"/>
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.02)"/>
    </linearGradient>

    <filter id="anpgGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="800" height="520" fill="url(#anpgBg)"/>
  
  <!-- Subtle Grid Lines -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="0.8">
    <line x1="0" y1="80" x2="800" y2="80"/>
    <line x1="0" y1="160" x2="800" y2="160"/>
    <line x1="0" y1="240" x2="800" y2="240"/>
    <line x1="0" y1="320" x2="800" y2="320"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
    <line x1="160" y1="0" x2="160" y2="520"/>
    <line x1="320" y1="0" x2="320" y2="520"/>
    <line x1="480" y1="0" x2="480" y2="520"/>
    <line x1="640" y1="0" x2="640" y2="520"/>
  </g>

  <!-- Ambient Light Reflection -->
  <circle cx="680" cy="80" r="140" fill="url(#anpgCyan)" opacity="0.09" filter="url(#anpgGlow)"/>
  <circle cx="100" cy="450" r="120" fill="url(#anpgGold)" opacity="0.06" filter="url(#anpgGlow)"/>

  <!-- Desktop Browser Window Frame -->
  <rect x="40" y="30" width="720" height="460" rx="14" fill="#0d101c" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1"/>

  <!-- Window Header -->
  <rect x="40" y="30" width="720" height="42" rx="14" fill="rgba(22, 27, 44, 0.9)"/>
  <circle cx="65" cy="51" r="5" fill="#ff5f56"/>
  <circle cx="82" cy="51" r="5" fill="#ffbd2e"/>
  <circle cx="99" cy="51" r="5" fill="#27c93f"/>

  <!-- Address Bar -->
  <rect x="130" y="40" width="450" height="22" rx="6" fill="rgba(10, 12, 20, 0.6)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="145" y="55" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="10">https://<tspan fill="#00F5D4">portal.anpg.gov.ao</tspan>/gestao-estrategica</text>

  <!-- Responsive Device Tags in Header -->
  <rect x="620" y="40" width="115" height="22" rx="6" fill="rgba(0, 245, 212, 0.1)" stroke="url(#anpgCyan)" stroke-width="0.8"/>
  <text x="632" y="55" fill="#00F5D4" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="600">RESPONSIVE AA+</text>

  <!-- Internal Web Portal Layout -->
  
  <!-- Portal Navigation Bar -->
  <rect x="40" y="72" width="720" height="48" fill="#111425" stroke="rgba(255, 255, 255, 0.05)" stroke-width="1"/>
  
  <text x="70" y="102" fill="#ffffff" font-family="'Space Grotesk', sans-serif" font-size="16" font-weight="800">ANPG <tspan fill="#00F5D4" font-size="12" font-weight="500">| AGÊNCIA NACIONAL</tspan></text>
  
  <g transform="translate(320, 93)" font-family="'Inter', sans-serif" font-size="11" fill="#94a3b8">
    <text x="0" y="8" fill="#ffffff" font-weight="600">Panorama Geral</text>
    <text x="110" y="8">Blocos & Bacias</text>
    <text x="220" y="8">Relatórios & Dados</text>
    <text x="330" y="8">Legislação</text>
  </g>

  <!-- Left Sidebar (Navigation & Filters) -->
  <rect x="40" y="120" width="160" height="370" fill="rgba(14, 18, 32, 0.7)" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1"/>
  
  <g transform="translate(56, 145)">
    <text x="0" y="10" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="9">// NAVEGAÇÃO</text>
    
    <rect x="0" y="24" width="130" height="30" rx="6" fill="rgba(0, 245, 212, 0.12)" stroke="rgba(0, 245, 212, 0.3)"/>
    <text x="12" y="43" fill="#00F5D4" font-family="'Inter', sans-serif" font-size="11" font-weight="600">Produção Ativa</text>

    <text x="12" y="82" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11">Concessões Onshore</text>
    <text x="12" y="116" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11">Concessões Offshore</text>
    <text x="12" y="150" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11">Transparência Fiscal</text>
    <text x="12" y="184" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11">Sustentabilidade ESG</text>
  </g>

  <!-- Main Content Area of Redesign -->
  <g transform="translate(220, 135)">
    <!-- Top KPI Cards -->
    <g transform="translate(0, 0)">
      <rect width="160" height="75" rx="8" fill="url(#glassBar)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
      <text x="14" y="22" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="10">PRODUÇÃO DIÁRIA (BPD)</text>
      <text x="14" y="48" fill="#ffffff" font-family="'Space Grotesk', sans-serif" font-size="19" font-weight="700">1,124,500</text>
      <text x="14" y="64" fill="#00F5D4" font-family="'JetBrains Mono', monospace" font-size="9">▲ +2.3% este trimestre</text>
    </g>

    <g transform="translate(175, 0)">
      <rect width="160" height="75" rx="8" fill="url(#glassBar)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
      <text x="14" y="22" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="10">BLOCOS EM OPERAÇÃO</text>
      <text x="14" y="48" fill="#ffffff" font-family="'Space Grotesk', sans-serif" font-size="19" font-weight="700">42 Ativos</text>
      <text x="14" y="64" fill="#FFB703" font-family="'JetBrains Mono', monospace" font-size="9">● 8 em licitação</text>
    </g>

    <g transform="translate(350, 0)">
      <rect width="160" height="75" rx="8" fill="url(#glassBar)" stroke="rgba(0, 245, 212, 0.25)" stroke-width="1"/>
      <text x="14" y="22" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="10">DESEMPENHO AMBIENTAL</text>
      <text x="14" y="48" fill="#00F5D4" font-family="'Space Grotesk', sans-serif" font-size="19" font-weight="700">96.8 / 100</text>
      <text x="14" y="64" fill="#cbd5e1" font-family="'JetBrains Mono', monospace" font-size="9">Certificação ISO 14001</text>
    </g>

    <!-- Main Chart Container -->
    <g transform="translate(0, 90)">
      <rect width="510" height="225" rx="10" fill="url(#glassBar)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
      
      <text x="18" y="26" fill="#ffffff" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="700">DESEMPENHO HISTÓRICO DE BARRIS POR BACIA (K/DIA)</text>

      <!-- Grid lines -->
      <line x1="20" y1="70" x2="490" y2="70" stroke="rgba(255,255,255,0.04)"/>
      <line x1="20" y1="120" x2="490" y2="120" stroke="rgba(255,255,255,0.04)"/>
      <line x1="20" y1="170" x2="490" y2="170" stroke="rgba(255,255,255,0.06)"/>

      <!-- Bar Columns Group -->
      <g transform="translate(35, 60)">
        <!-- Month 1 -->
        <rect x="0" y="40" width="22" height="70" rx="3" fill="#00F5D4" opacity="0.85"/>
        <rect x="26" y="65" width="22" height="45" rx="3" fill="#0099FF" opacity="0.6"/>
        <text x="14" y="125" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="9">JAN</text>

        <!-- Month 2 -->
        <rect x="80" y="30" width="22" height="80" rx="3" fill="#00F5D4" opacity="0.85"/>
        <rect x="106" y="55" width="22" height="55" rx="3" fill="#0099FF" opacity="0.6"/>
        <text x="94" y="125" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="9">FEV</text>

        <!-- Month 3 -->
        <rect x="160" y="20" width="22" height="90" rx="3" fill="#00F5D4" opacity="0.9"/>
        <rect x="186" y="45" width="22" height="65" rx="3" fill="#0099FF" opacity="0.6"/>
        <text x="174" y="125" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="9">MAR</text>

        <!-- Month 4 -->
        <rect x="240" y="15" width="22" height="95" rx="3" fill="#00F5D4" opacity="0.95"/>
        <rect x="266" y="35" width="22" height="75" rx="3" fill="#0099FF" opacity="0.6"/>
        <text x="254" y="125" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="9">ABR</text>

        <!-- Month 5 -->
        <rect x="320" y="10" width="22" height="100" rx="3" fill="#00F5D4" filter="url(#anpgGlow)"/>
        <rect x="346" y="30" width="22" height="80" rx="3" fill="#0099FF" opacity="0.7"/>
        <text x="334" y="125" fill="#00F5D4" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700">MAI</text>

        <!-- Month 6 (Forecast) -->
        <rect x="400" y="5" width="22" height="105" rx="3" fill="none" stroke="#00F5D4" stroke-width="1.5" stroke-dasharray="3 3"/>
        <rect x="426" y="25" width="22" height="85" rx="3" fill="none" stroke="#0099FF" stroke-width="1.5" stroke-dasharray="3 3"/>
        <text x="414" y="125" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="9">JUN*</text>
      </g>

      <!-- Chart Legend -->
      <g transform="translate(20, 202)">
        <rect x="0" y="0" width="10" height="10" rx="2" fill="#00F5D4"/>
        <text x="16" y="9" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="10">Bacia do Baixo Congo</text>

        <rect x="160" y="0" width="10" height="10" rx="2" fill="#0099FF"/>
        <text x="176" y="9" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="10">Bacia do Kwanza</text>

        <text x="340" y="9" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="9">* Projeção validada</text>
      </g>
    </g>
  </g>
</svg>
