<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="100%" height="100%">
  <defs>
    <!-- Dark Sci-fi Background Gradient -->
    <linearGradient id="artBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080711"/>
      <stop offset="40%" stop-color="#110d24"/>
      <stop offset="80%" stop-color="#161033"/>
      <stop offset="100%" stop-color="#07060f"/>
    </linearGradient>

    <!-- Liquid Iridescent Gradients -->
    <linearGradient id="iridescent1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F5D4"/>
      <stop offset="30%" stop-color="#7B2CBF"/>
      <stop offset="70%" stop-color="#F72585"/>
      <stop offset="100%" stop-color="#4CC9F0"/>
    </linearGradient>

    <linearGradient id="liquidChrome" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1a1c2b"/>
      <stop offset="25%" stop-color="#e0e7ff"/>
      <stop offset="50%" stop-color="#2d3748"/>
      <stop offset="75%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#1a202c"/>
    </linearGradient>

    <linearGradient id="glassFacet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.4)"/>
      <stop offset="30%" stop-color="rgba(255, 255, 255, 0.08)"/>
      <stop offset="70%" stop-color="rgba(0, 245, 212, 0.15)"/>
      <stop offset="100%" stop-color="rgba(247, 37, 133, 0.25)"/>
    </linearGradient>

    <!-- Glows & Refractions -->
    <filter id="liquidGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="24" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softDispersion" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1000" height="520" fill="url(#artBg)"/>

  <!-- Ambient Chromatic Flares -->
  <circle cx="280" cy="240" r="220" fill="url(#iridescent1)" opacity="0.3" filter="url(#liquidGlow)"/>
  <circle cx="750" cy="280" r="180" fill="#00F5D4" opacity="0.15" filter="url(#liquidGlow)"/>
  <circle cx="500" cy="100" r="150" fill="#F72585" opacity="0.12" filter="url(#liquidGlow)"/>

  <!-- Technical Overlay Grid & Crop Marks -->
  <g opacity="0.15" stroke="#ffffff" stroke-width="0.8">
    <!-- Center grid cross -->
    <line x1="50" y1="50" x2="950" y2="50"/>
    <line x1="50" y1="470" x2="950" y2="470"/>
    <line x1="50" y1="50" x2="50" y2="470"/>
    <line x1="950" y1="50" x2="950" y2="470"/>

    <!-- Registration Crosses -->
    <circle cx="50" cy="50" r="8" fill="none"/>
    <line x1="50" y1="38" x2="50" y2="62"/>
    <line x1="38" y1="50" x2="62" y2="50"/>

    <circle cx="950" cy="50" r="8" fill="none"/>
    <circle cx="50" cy="470" r="8" fill="none"/>
    <circle cx="950" cy="470" r="8" fill="none"/>
  </g>

  <!-- Specimen Typography & Editorial Accents -->
  <text x="80" y="90" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="11" letter-spacing="3">EXPLORAÇÃO GRÁFICA // ESTUDO Nº 04</text>
  <text x="80" y="115" fill="#ffffff" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="700">SPECIMEN DE REFRAÇÃO ÓPTICA & BRANDING CINÉTICO</text>

  <!-- Right side Editorial Code -->
  <text x="780" y="90" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="10">REFRACTIVE INDEX: η = 1.54</text>
  <text x="780" y="108" fill="#00F5D4" font-family="'JetBrains Mono', monospace" font-size="10">CHROMATIC ABERRATION: ACTIVE</text>

  <!-- ================= 3D Liquid Glass Abstract Shapes ================= -->
  
  <!-- Ribbon 1: Deep Fluid Wave -->
  <path d="M 120 380 C 260 480, 420 310, 520 220 C 620 130, 780 180, 880 290" 
        fill="none" 
        stroke="url(#iridescent1)" 
        stroke-width="50" 
        stroke-linecap="round"
        opacity="0.4"
        filter="url(#softDispersion)"/>

  <!-- Ribbon 2: Sharp Glass Blade Form with Gradient Masking -->
  <path d="M 180 340 C 320 440, 440 280, 540 180 C 640 80, 780 160, 840 250" 
        fill="none" 
        stroke="url(#liquidChrome)" 
        stroke-width="28" 
        stroke-linecap="round"/>

  <!-- Frosted Glass Prismatic Card Floating in Foreground (Center Left) -->
  <g transform="translate(240, 160) rotate(-6)">
    <!-- Glass Plate -->
    <rect width="280" height="180" rx="20" fill="url(#glassFacet)" stroke="rgba(255, 255, 255, 0.45)" stroke-width="1.5"/>
    
    <!-- Glass Highlight Sheen Diagonal -->
    <path d="M 0 40 L 140 0 L 100 180 L 0 180 Z" fill="rgba(255,255,255,0.12)"/>

    <text x="30" y="45" fill="#ffffff" font-family="'Syne', sans-serif" font-size="24" font-weight="800" letter-spacing="1">LIQUID GLASS</text>
    <text x="30" y="70" fill="#00F5D4" font-family="'JetBrains Mono', monospace" font-size="10">SISTEMA DE IDENTIDADE VISUAL</text>

    <!-- Specimen Bars -->
    <rect x="30" y="95" width="220" height="4" rx="2" fill="url(#iridescent1)"/>
    <rect x="30" y="108" width="160" height="2" rx="1" fill="rgba(255,255,255,0.3)"/>

    <!-- Micro Circular Badges -->
    <circle cx="45" cy="140" r="12" fill="rgba(0, 245, 212, 0.2)" stroke="#00F5D4" stroke-width="1"/>
    <circle cx="80" cy="140" r="12" fill="rgba(247, 37, 133, 0.2)" stroke="#F72585" stroke-width="1"/>
    <circle cx="115" cy="140" r="12" fill="rgba(123, 44, 191, 0.2)" stroke="#7B2CBF" stroke-width="1"/>
  </g>

  <!-- Large Refractive Liquid Sphere (Center Right) -->
  <g transform="translate(640, 260)">
    <!-- Base Glow -->
    <circle cx="0" cy="0" r="95" fill="url(#glassFacet)" stroke="rgba(255,255,255,0.6)" stroke-width="2"/>
    
    <!-- Spherical Curvature Highlight -->
    <ellipse cx="-28" cy="-32" rx="42" ry="24" transform="rotate(-30, -28, -32)" fill="rgba(255,255,255,0.35)"/>
    
    <!-- Chromatic Edge Flare -->
    <path d="M 40 -80 A 95 95 0 0 1 90 20" fill="none" stroke="#00F5D4" stroke-width="4" filter="url(#liquidGlow)"/>
    <path d="M -85 20 A 95 95 0 0 1 -40 85" fill="none" stroke="#F72585" stroke-width="4" filter="url(#liquidGlow)"/>

    <!-- Inner Refracted Lettermark "Q" or "O" -->
    <circle cx="0" cy="0" r="38" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="6"/>
  </g>

  <!-- Floating Smaller Glass Spheres -->
  <circle cx="170" cy="200" r="28" fill="url(#glassFacet)" stroke="rgba(255,255,255,0.4)" stroke-width="1"/>
  <circle cx="840" cy="160" r="38" fill="url(#glassFacet)" stroke="rgba(255,255,255,0.5)" stroke-width="1.2"/>
  <circle cx="560" cy="400" r="20" fill="url(#glassFacet)" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>

  <!-- Footer Technical Specimen Info -->
  <g transform="translate(80, 445)">
    <text x="0" y="0" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="10">PALETA:</text>
    <rect x="65" y="-10" width="14" height="14" rx="3" fill="#00F5D4"/>
    <rect x="85" y="-10" width="14" height="14" rx="3" fill="#7B2CBF"/>
    <rect x="105" y="-10" width="14" height="14" rx="3" fill="#F72585"/>
    <rect x="125" y="-10" width="14" height="14" rx="3" fill="#ffffff"/>

    <text x="500" y="0" fill="#64748b" font-family="'Inter', sans-serif" font-size="11">Composição desenvolvida com Adobe Photoshop, Illustrator & Shaders 3D</text>
  </g>
</svg>
