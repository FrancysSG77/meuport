<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="100%" height="100%">
  <defs>
    <linearGradient id="mobileBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a14"/>
      <stop offset="50%" stop-color="#121026"/>
      <stop offset="100%" stop-color="#06060c"/>
    </linearGradient>

    <linearGradient id="phoneBodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181c2f"/>
      <stop offset="100%" stop-color="#0c0e18"/>
    </linearGradient>

    <linearGradient id="appScreenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f111e"/>
      <stop offset="100%" stop-color="#090a13"/>
    </linearGradient>

    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F5D4"/>
      <stop offset="100%" stop-color="#00BBF9"/>
    </linearGradient>

    <linearGradient id="neonPurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#A259FF"/>
      <stop offset="100%" stop-color="#F72585"/>
    </linearGradient>

    <linearGradient id="glassCardGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.1)"/>
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.02)"/>
    </linearGradient>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <pattern id="dotMatrix" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="1" fill="rgba(255,255,255,0.04)"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="800" height="520" fill="url(#mobileBg)"/>
  <rect width="800" height="520" fill="url(#dotMatrix)"/>

  <!-- Ambient Glow Blobs -->
  <circle cx="240" cy="200" r="180" fill="url(#neonPurple)" opacity="0.15" filter="url(#softGlow)"/>
  <circle cx="560" cy="300" r="160" fill="url(#neonCyan)" opacity="0.12" filter="url(#softGlow)"/>

  <!-- Background Graphic Elements & Floating Badges -->
  <!-- Left Side Info / Graphic Elements -->
  <g transform="translate(60, 110)">
    <rect width="210" height="90" rx="14" fill="url(#glassCardGradient)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <text x="20" y="32" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="11">// SCORE DE PROTEÇÃO</text>
    <text x="20" y="65" fill="#00F5D4" font-family="'Space Grotesk', sans-serif" font-size="28" font-weight="700">98.5 <tspan font-size="14" fill="#64748b">/ 100</tspan></text>
    <text x="20" y="80" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="10">● Apólice Premium Ativa</text>
  </g>

  <g transform="translate(50, 240)">
    <rect width="220" height="150" rx="14" fill="url(#glassCardGradient)" stroke="rgba(162, 89, 255, 0.25)" stroke-width="1"/>
    <text x="20" y="32" fill="#A259FF" font-family="'JetBrains Mono', monospace" font-size="11">COBERTURA RÁPIDA 24H</text>
    
    <path d="M 20 60 L 60 60 L 75 75 L 120 75 L 135 60 L 200 60" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="2"/>
    <circle cx="75" cy="75" r="4" fill="#A259FF"/>
    <circle cx="120" cy="75" r="4" fill="#00F5D4"/>

    <text x="20" y="110" fill="#ffffff" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="600">Assistência Auto & Residencial</text>
    <text x="20" y="130" fill="#64748b" font-family="'Inter', sans-serif" font-size="11">Acionamento em 1 clique via app</text>
  </g>

  <!-- ================= Center Mobile Phone Mockup ================= -->
  <g transform="translate(320, 35)">
    <!-- Smartphone Outer Shadow & Bezel -->
    <rect width="260" height="455" rx="36" fill="#05060b" stroke="rgba(255,255,255,0.15)" stroke-width="2"/>
    <rect x="6" y="6" width="248" height="443" rx="30" fill="url(#appScreenGrad)"/>

    <!-- Dynamic Island / Speaker Notch -->
    <rect x="90" y="16" width="80" height="18" rx="9" fill="#000000" stroke="rgba(255,255,255,0.05)" stroke-width="0.8"/>
    <circle cx="152" cy="25" r="4" fill="#141829"/>

    <!-- App Header -->
    <g transform="translate(20, 52)">
      <text x="0" y="14" fill="#64748b" font-family="'Inter', sans-serif" font-size="10">BEM-VINDO AO</text>
      <text x="0" y="32" fill="#ffffff" font-family="'Space Grotesk', sans-serif" font-size="16" font-weight="700">Prefira Seguros</text>

      <!-- Profile Avatar with glowing border -->
      <circle cx="205" cy="22" r="16" fill="url(#neonCyan)" opacity="0.2"/>
      <circle cx="205" cy="22" r="14" fill="#1e2238" stroke="#00F5D4" stroke-width="1.5"/>
      <text x="199" y="27" fill="#00F5D4" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="700">P</text>
    </g>

    <!-- App Card: Policy Hero (Glass Card) -->
    <g transform="translate(18, 105)">
      <rect width="224" height="125" rx="16" fill="url(#glassCardGradient)" stroke="rgba(0, 245, 212, 0.3)" stroke-width="1"/>
      
      <!-- Card internal gradient beam -->
      <path d="M 0 30 Q 112 0, 224 40 L 224 125 L 0 125 Z" fill="url(#neonCyan)" opacity="0.08"/>

      <text x="16" y="26" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="9">PLANO TOTAL PROTECT</text>
      <text x="16" y="52" fill="#ffffff" font-family="'Space Grotesk', sans-serif" font-size="18" font-weight="700">Veículo & Vida Digital</text>

      <!-- Biometric Badge -->
      <g transform="translate(16, 72)">
        <rect width="80" height="24" rx="12" fill="rgba(0, 245, 212, 0.15)"/>
        <text x="12" y="16" fill="#00F5D4" font-family="'JetBrains Mono', monospace" font-size="9">✓ ATIVO</text>
      </g>

      <!-- Micro Biometric Icon -->
      <g transform="translate(175, 68)" stroke="#A259FF" stroke-width="1.5" fill="none">
        <path d="M0 12 A 12 12 0 0 1 24 12"/>
        <path d="M4 14 A 8 8 0 0 1 20 14"/>
        <path d="M8 16 A 4 4 0 0 1 16 16"/>
        <circle cx="12" cy="18" r="1" fill="#A259FF"/>
      </g>

      <text x="16" y="112" fill="#64748b" font-family="'Inter', sans-serif" font-size="9">Renovação garantida até Dez/2027</text>
    </g>

    <!-- Services Grid on Mobile -->
    <g transform="translate(18, 245)">
      <!-- Item 1: Auto -->
      <rect x="0" y="0" width="106" height="78" rx="12" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
      <circle cx="24" cy="24" r="12" fill="rgba(0, 245, 212, 0.1)"/>
      <text x="18" y="28" fill="#00F5D4" font-size="12">🚗</text>
      <text x="12" y="52" fill="#ffffff" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="600">Auto Seguro</text>
      <text x="12" y="66" fill="#64748b" font-family="'Inter', sans-serif" font-size="8">Sinistro 24h</text>

      <!-- Item 2: Vida -->
      <rect x="118" y="0" width="106" height="78" rx="12" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
      <circle cx="142" cy="24" r="12" fill="rgba(162, 89, 255, 0.1)"/>
      <text x="136" y="28" fill="#A259FF" font-size="12">🛡️</text>
      <text x="130" y="52" fill="#ffffff" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="600">Vida & Saúde</text>
      <text x="130" y="66" fill="#64748b" font-family="'Inter', sans-serif" font-size="8">Sem franquia</text>
    </g>

    <!-- Quick Action Button inside Phone -->
    <g transform="translate(18, 340)">
      <rect width="224" height="42" rx="21" fill="url(#neonCyan)" filter="url(#softGlow)" opacity="0.9"/>
      <text x="56" y="26" fill="#090a10" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="700">Acionar Sinistro Fácil</text>
    </g>

    <!-- Bottom Navigation Bar inside Phone -->
    <g transform="translate(18, 400)">
      <rect width="224" height="34" rx="17" fill="rgba(15,18,30,0.8)" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
      <circle cx="45" cy="17" r="4" fill="#00F5D4"/>
      <circle cx="95" cy="17" r="3" fill="#475569"/>
      <circle cx="145" cy="17" r="3" fill="#475569"/>
      <circle cx="185" cy="17" r="3" fill="#475569"/>
      <line x1="85" y1="30" x2="140" y2="30" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
    </g>
  </g>

  <!-- Right Side Ambient UI Card -->
  <g transform="translate(605, 170)">
    <rect width="145" height="190" rx="14" fill="url(#glassCardGradient)" stroke="rgba(0, 245, 212, 0.2)" stroke-width="1"/>
    
    <text x="16" y="28" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="10">INTERAÇÃO UI</text>
    <text x="16" y="55" fill="#ffffff" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="700">Haptic Feedback</text>
    
    <!-- Micro soundwave -->
    <g transform="translate(16, 75)" stroke="#00F5D4" stroke-width="2" stroke-linecap="round">
      <line x1="5" y1="15" x2="5" y2="25"/>
      <line x1="15" y1="5" x2="15" y2="35"/>
      <line x1="25" y1="10" x2="25" y2="30"/>
      <line x1="35" y1="0" x2="35" y2="40"/>
      <line x1="45" y1="8" x2="45" y2="32"/>
      <line x1="55" y1="18" x2="55" y2="22"/>
    </g>

    <text x="16" y="145" fill="#64748b" font-family="'Inter', sans-serif" font-size="10">Tempo de Resposta</text>
    <text x="16" y="165" fill="#00F5D4" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="600">&lt; 150ms</text>
  </g>
</svg>
