<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="100%" height="100%">
  <defs>
    <linearGradient id="stBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a14"/>
      <stop offset="50%" stop-color="#121124"/>
      <stop offset="100%" stop-color="#07070d"/>
    </linearGradient>

    <linearGradient id="stCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F5D4"/>
      <stop offset="100%" stop-color="#00BBF9"/>
    </linearGradient>

    <linearGradient id="stOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5E00"/>
      <stop offset="100%" stop-color="#FF007A"/>
    </linearGradient>

    <linearGradient id="stYellow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFBE0B"/>
      <stop offset="100%" stop-color="#FB5607"/>
    </linearGradient>

    <linearGradient id="stKeyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e2238"/>
      <stop offset="100%" stop-color="#121524"/>
    </linearGradient>

    <filter id="stGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <pattern id="stDotGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="15" cy="15" r="1.2" fill="rgba(255,255,255,0.05)"/>
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="750" fill="url(#stBg)"/>
  <rect width="1200" height="750" fill="url(#stDotGrid)"/>

  <!-- Ambient Light Blobs -->
  <circle cx="200" cy="180" r="220" fill="url(#stCyan)" opacity="0.12" filter="url(#stGlow)"/>
  <circle cx="1020" cy="520" r="260" fill="url(#stOrange)" opacity="0.1" filter="url(#stGlow)"/>
  <circle cx="600" cy="700" r="180" fill="url(#stYellow)" opacity="0.08" filter="url(#stGlow)"/>

  <!-- Main Game Browser Window Frame -->
  <g transform="translate(60, 45)">
    <rect width="1080" height="660" rx="16" fill="#0c0e1a" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
    
    <!-- Window Bar -->
    <rect width="1080" height="48" rx="16" fill="rgba(20, 24, 40, 0.9)"/>
    <circle cx="32" cy="24" r="6" fill="#ff5f56"/>
    <circle cx="52" cy="24" r="6" fill="#ffbd2e"/>
    <circle cx="72" cy="24" r="6" fill="#27c93f"/>

    <text x="110" y="29" fill="#94a3b8" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="600">super-teclas-flutter.vercel.app // JOGO DE DACTILOGRAFIA ANGOLANO</text>
    
    <rect x="910" y="12" width="145" height="24" rx="12" fill="rgba(0, 245, 212, 0.15)" stroke="url(#stCyan)" stroke-width="1"/>
    <circle cx="925" cy="24" r="3.5" fill="#00F5D4"/>
    <text x="936" y="28" fill="#00F5D4" font-family="'Space Grotesk', sans-serif" font-size="10" font-weight="700">ONLINE • AO VIVO</text>

    <!-- Game Header Navigation inside app -->
    <g transform="translate(40, 75)">
      <!-- Logo: SUPER TECLAS -->
      <g>
        <rect x="0" y="0" width="38" height="38" rx="8" fill="url(#stCyan)"/>
        <text x="10" y="27" fill="#07090e" font-family="'Syne', sans-serif" font-size="22" font-weight="800">ST</text>
        <text x="50" y="20" fill="#ffffff" font-family="'Syne', sans-serif" font-size="18" font-weight="800" letter-spacing="0.05em">SUPER TECLAS</text>
        <text x="50" y="34" fill="#00F5D4" font-family="'Space Grotesk', sans-serif" font-size="10" font-weight="600" letter-spacing="0.1em">EDIÇÃO ANGOLA 🇦🇴</text>
      </g>

      <!-- Live Player Stats Bar -->
      <g transform="translate(680, 0)">
        <!-- Stat 1: WPM -->
        <g transform="translate(0, 0)">
          <rect width="105" height="42" rx="8" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.08)"/>
          <text x="14" y="16" fill="#64748b" font-family="'Space Grotesk', sans-serif" font-size="9">VELOCIDADE</text>
          <text x="14" y="34" fill="#00F5D4" font-family="'Space Grotesk', sans-serif" font-size="16" font-weight="700">92 <tspan font-size="9" fill="#94a3b8">WPM</tspan></text>
        </g>

        <!-- Stat 2: Accuracy -->
        <g transform="translate(118, 0)">
          <rect width="105" height="42" rx="8" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.08)"/>
          <text x="14" y="16" fill="#64748b" font-family="'Space Grotesk', sans-serif" font-size="9">PRECISÃO</text>
          <text x="14" y="34" fill="#FFBE0B" font-family="'Space Grotesk', sans-serif" font-size="16" font-weight="700">98.5%</text>
        </g>

        <!-- Stat 3: Streak -->
        <g transform="translate(236, 0)">
          <rect width="105" height="42" rx="8" fill="rgba(255,94,0,0.1)" stroke="url(#stOrange)"/>
          <text x="14" y="16" fill="#FF5E00" font-family="'Space Grotesk', sans-serif" font-size="9">STREAK 🔥</text>
          <text x="14" y="34" fill="#ffffff" font-family="'Space Grotesk', sans-serif" font-size="16" font-weight="700">142</text>
        </g>
      </g>
    </g>

    <!-- Game Typing Interactive Area -->
    <g transform="translate(40, 150)">
      <rect width="1000" height="220" rx="14" fill="rgba(16, 20, 36, 0.7)" stroke="rgba(0, 245, 212, 0.25)" stroke-width="1.2"/>
      
      <!-- Top prompt metadata -->
      <g transform="translate(28, 28)">
        <text x="0" y="0" fill="#64748b" font-family="'Space Grotesk', sans-serif" font-size="11" letter-spacing="0.1em">TEXTO DE DACTILOGRAFIA • MODO COMPETITIVO</text>
        <rect x="840" y="-12" width="105" height="22" rx="6" fill="rgba(255,255,255,0.06)"/>
        <text x="852" y="3" fill="#cbd5e1" font-family="'Space Grotesk', sans-serif" font-size="10">TEMPO: 00:45s</text>
      </g>

      <!-- Typing Sentence -->
      <g transform="translate(28, 75)" font-family="'Space Grotesk', sans-serif" font-size="23" font-weight="600" letter-spacing="0.02em">
        <!-- Typed Correct (Cyan) -->
        <text x="0" y="0" fill="#00F5D4">A tecnologia e a criatividade unem-se em Angola para </text>
        <!-- Current word with animated blinking cursor -->
        <text x="0" y="42" fill="#ffffff">capacitar </text>
        <line x1="120" y1="20" x2="120" y2="46" stroke="#00F5D4" stroke-width="2.5" filter="url(#stGlow)"/>
        <!-- Remaining text (Muted) -->
        <text x="128" y="42" fill="#475569">uma nova geração de profissionais e mentes digitais com </text>
        <text x="0" y="84" fill="#334155">dactilografia rápida, interfaces ergonómicas e design de vanguarda.</text>
      </g>

      <!-- Bottom Progress Bar -->
      <g transform="translate(28, 195)">
        <rect width="944" height="6" rx="3" fill="rgba(255,255,255,0.06)"/>
        <rect width="520" height="6" rx="3" fill="url(#stCyan)"/>
      </g>
    </g>

    <!-- Virtual Glowing Keyboard Display (Typing Game Visual) -->
    <g transform="translate(180, 400)">
      <!-- Keyboard Frame -->
      <rect width="720" height="185" rx="14" fill="rgba(14, 17, 30, 0.85)" stroke="rgba(255,255,255,0.08)"/>

      <!-- Row 1 -->
      <g transform="translate(30, 20)">
        <rect x="0" width="58" height="34" rx="6" fill="url(#stKeyGrad)" stroke="rgba(255,255,255,0.08)"/>
        <text x="24" y="22" fill="#94a3b8" font-family="'Space Grotesk', sans-serif" font-size="12">Q</text>
        <rect x="66" width="58" height="34" rx="6" fill="url(#stKeyGrad)" stroke="rgba(255,255,255,0.08)"/>
        <text x="90" y="22" fill="#94a3b8" font-family="'Space Grotesk', sans-serif" font-size="12">W</text>
        <rect x="132" width="58" height="34" rx="6" fill="url(#stKeyGrad)" stroke="rgba(255,255,255,0.08)"/>
        <text x="157" y="22" fill="#94a3b8" font-family="'Space Grotesk', sans-serif" font-size="12">E</text>
        <rect x="198" width="58" height="34" rx="6" fill="url(#stKeyGrad)" stroke="rgba(255,255,255,0.08)"/>
        <text x="223" y="22" fill="#94a3b8" font-family="'Space Grotesk', sans-serif" font-size="12">R</text>
        <rect x="264" width="58" height="34" rx="6" fill="url(#stCyan)" stroke="#00F5D4" filter="url(#stGlow)"/>
        <text x="289" y="22" fill="#07090e" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="700">T</text>
        <rect x="330" width="58" height="34" rx="6" fill="url(#stKeyGrad)" stroke="rgba(255,255,255,0.08)"/>
        <text x="355" y="22" fill="#94a3b8" font-family="'Space Grotesk', sans-serif" font-size="12">Y</text>
        <rect x="396" width="58" height="34" rx="6" fill="url(#stKeyGrad)" stroke="rgba(255,255,255,0.08)"/>
        <text x="421" y="22" fill="#94a3b8" font-family="'Space Grotesk', sans-serif" font-size="12">U</text>
        <rect x="462" width="58" height="34" rx="6" fill="url(#stKeyGrad)" stroke="rgba(255,255,255,0.08)"/>
        <text x="488" y="22" fill="#94a3b8" font-family="'Space Grotesk', sans-serif" font-size="12">I</text>
        <rect x="528" width="58" height="34" rx="6" fill="url(#stKeyGrad)" stroke="rgba(255,255,255,0.08)"/>
        <text x="552" y="22" fill="#94a3b8" font-family="'Space Grotesk', sans-serif" font-size="12">O</text>
        <rect x="594" width="66" height="34" rx="6" fill="url(#stKeyGrad)" stroke="rgba(255,255,255,0.08)"/>
        <text x="622" y="22" fill="#94a3b8" font-family="'Space Grotesk', sans-serif" font-size="12">P</text>
      </g>

      <!-- Row 2 -->
      <g transform="translate(50, 64)">
        <rect x="0" width="58" height="34" rx="6" fill="url(#stKeyGrad)" stroke="rgba(255,255,255,0.08)"/>
        <text x="24" y="22" fill="#94a3b8" font-family="'Space Grotesk', sans-serif" font-size="12">A</text>
        <rect x="66" width="58" height="34" rx="6" fill="url(#stKeyGrad)" stroke="rgba(255,255,255,0.08)"/>
        <text x="91" y="22" fill="#94a3b8" font-family="'Space Grotesk', sans-serif" font-size="12">S</text>
        <rect x="132" width="58" height="34" rx="6" fill="url(#stKeyGrad)" stroke="rgba(255,255,255,0.08)"/>
        <text x="157" y="22" fill="#94a3b8" font-family="'Space Grotesk', sans-serif" font-size="12">D</text>
        <rect x="198" width="58" height="34" rx="6" fill="url(#stKeyGrad)" stroke="rgba(255,255,255,0.08)"/>
        <text x="223" y="22" fill="#94a3b8" font-family="'Space Grotesk', sans-serif" font-size="12">F</text>
        <rect x="264" width="58" height="34" rx="6" fill="url(#stKeyGrad)" stroke="rgba(255,255,255,0.08)"/>
        <text x="288" y="22" fill="#94a3b8" font-family="'Space Grotesk', sans-serif" font-size="12">G</text>
        <rect x="330" width="58" height="34" rx="6" fill="url(#stKeyGrad)" stroke="rgba(255,255,255,0.08)"/>
        <text x="354" y="22" fill="#94a3b8" font-family="'Space Grotesk', sans-serif" font-size="12">H</text>
        <rect x="396" width="58" height="34" rx="6" fill="url(#stKeyGrad)" stroke="rgba(255,255,255,0.08)"/>
        <text x="422" y="22" fill="#94a3b8" font-family="'Space Grotesk', sans-serif" font-size="12">J</text>
        <rect x="462" width="58" height="34" rx="6" fill="url(#stKeyGrad)" stroke="rgba(255,255,255,0.08)"/>
        <text x="487" y="22" fill="#94a3b8" font-family="'Space Grotesk', sans-serif" font-size="12">K</text>
        <rect x="528" width="88" height="34" rx="6" fill="rgba(0,245,212,0.12)" stroke="url(#stCyan)"/>
        <text x="555" y="22" fill="#00F5D4" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="700">ENTER ↵</text>
      </g>

      <!-- Spacebar Row -->
      <g transform="translate(180, 112)">
        <rect width="360" height="36" rx="8" fill="url(#stKeyGrad)" stroke="rgba(255,255,255,0.1)"/>
        <text x="145" y="23" fill="#64748b" font-family="'Space Grotesk', sans-serif" font-size="11">SPACEBAR</text>
      </g>
    </g>
  </g>
</svg>
